[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuemseditor"
version = "0.1.1"
description = "CUEMS Editor - WebSocket server for collaborative editing and project management"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0"
keywords = ["cuems", "editor", "websocket", "collaboration"]
authors = [
    { name = "CUEMS Team", email = "cuems@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "cuemsutils>=0.1.1,<0.1.2",
    "peewee>=3.17.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "mkdocs",
]

[project.urls]
Homepage = "https://github.com/stagesoft/cuems-editor"
Documentation = "https://stagesoft.github.io/cuems-editor/"
Repository = "https://github.com/stagesoft/cuems-editor"
Issues = "https://github.com/stagesoft/cuems-editor/issues"

[project.scripts]
cuems-editor = "cuemseditor.cli:main"
cuems-editor-manual = "cuemseditor.run_manual:main"
cuems-editor-repair-durations = "cuemseditor.repair_durations:main"

[tool.hatch.version]
path = "src/cuemseditor/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py311"
# specs/ is frozen history (its evidence scripts are records, not code to maintain); site/ is build output.
extend-exclude = ["site", "specs", "dev/scripts/manual-ui/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["cuemseditor", "support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: pure logic; every socket, JACK and subprocess mocked; xdist-safe (applied from tests/unit)",
    "integration: a real socket, subprocess, JACK/ALSA or a wall-clock wait (applied from tests/integration)",
    "contract: repository and packaging invariants (applied from tests/contract)",
]

[tool.hatch.build.targets.sdist]
packages = ["src/cuemseditor"]

[tool.hatch.build.targets.wheel]
packages = ["src/cuemseditor"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
